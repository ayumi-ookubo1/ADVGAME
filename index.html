<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あの日をもう一度</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Nosifer&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== 注意書き ===== -->
<template id="page-warning">
    <div class="warning">
        <p class="warning-title">⚠ ご注意ください</p>
        <p>このゲームには、いじめや死に関する表現が含まれます。</p>
        <p>画面の揺れや、文字の点滅の演出もあります。</p>
        <p>気分が悪くなったら、無理せずプレイを中断してください。</p>
        <p id="warning-press" class="warning-press" style="visibility:hidden;">Press Enter</p>
    </div>
    <script>
        let ready=false;
        // 3秒たつまで進めない（注意書きを読んでもらうため）
        setTimeout(()=>{
            ready=true;
            document.getElementById("warning-press").style.visibility="visible";
        },3000);

        function goTitle(){
            if(!ready) return;
            location.href='?page=title';
        }
        window.addEventListener('keydown',(e)=>{
            if(e.key==='Enter') goTitle();
        });
        document.addEventListener('click',goTitle);
    </script>
</template>

<!-- ===== タイトル ===== -->
<template id="page-title">
    <div onclick="startGame()" class="title" style="cursor: pointer;">
        <h1>あの日をもう一度</h1>
        <p>Press Enter to start</p>
    </div>
    <script>
        let started=false;

        function startGame(){
            if(started) return;
            started=true;
            localStorage.removeItem("score");   // 新しく始めるたびに0からスタート
            const se=new Audio("sounds/horrific_blow1.mp3");
            se.play();
            setTimeout(()=>{
                location.href='?page=Prologue';
            },3000);
        }

        window.addEventListener('keydown',(e)=>{
            if(e.key==='Enter') startGame();
        });
    </script>
</template>

<!-- ===== プロローグ ===== -->
<template id="page-Prologue">
    <div class="prologue-panel" style="background-color: black; width: 1280px; height: 720px; position: relative;">
        <div id="message-window" style="display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 800px;">
            <div id="prologue-message-box" style="color: white; padding: 40px; font-size: 24px; min-height: 100px; cursor: pointer; text-align: center; line-height: 1.8; position: relative;">
            </div>
            <div id="next-arrow" class="next-arrow" style="display: none; position: absolute; bottom: 0; right: 40px; color: white;">▼</div>
        </div>
    </div>
</template>

<!-- ===== エンディング（1と2で共通） ===== -->

        <div id="message-window" style="display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 800px;">

<!-- ===== エンディングのマップ画面（セリフ枠つき）。ending.js が切り替えて使う ===== -->

    <div class="gamestage gamestage3" tabindex="0">
        <div id="message-window" class="game-window">
            <div id="name-box" class="game-name-box">???</div>
            <div id="game-message-box" class="game-message-box">
                <div id="next-arrow" class="next-arrow">▼</div>
            </div>
        </div>
    </div>

<!-- ===== ページ切り替え（PHPの代わり） ===== -->
<script>
(function(){
    const VER = "2";   // ファイルを更新したら数字を変えると、古い版が残らない
    const page = new URLSearchParams(location.search).get("page") || "warning";
    const key  = (page === "ending1" || page === "ending2") ? "ending" : page;

    // ?page=abc のように、存在しないページ名のときは、メッセージを出して止まる。
    const tpl = document.getElementById("page-" + key);
    if (!tpl) {
        document.write("<p style='color:#ccc'>ページが見つかりません</p>");
        return;
    }
    document.write(tpl.innerHTML);

    // ページごとに読み込むスクリプト
    const scripts = {
        Prologue:   ["script.js"],
        gamestart1: ["script.js", "stage1.js"],
        gamestart2: ["script.js", "stage2.js"],
        ending:     ["script.js", "ending.js"]
    }[key] || [];

    scripts.forEach(function(s){
        document.write('<script src="' + s + '?v=' + VER + '"><\/script>');
    });
})();

// <!-- ===== 画面の大きさに合わせて、ゲーム全体を拡大・縮小する ===== -->

    function fitGame(){
        const W = 1280;                                              // ゲーム画面の幅
        const hasStage = document.querySelector(".gamestage");       // ステージはセリフ枠が下にはみ出す
        const H = hasStage ? 720 + 190 + 20 : 720 + 20;              // 必要な高さ（余白20px込み）
        const scale = Math.min(1, window.innerWidth / W, window.innerHeight / H);
        document.documentElement.style.zoom = scale;
    }
    window.addEventListener("resize", fitGame);
    fitGame();
</script>

</body>

</html>
